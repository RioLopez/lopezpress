# Nginx 配置（生产）
# 作用：
#   - 前端静态资源（Preact 构建产物）由 Nginx 直接服务
#   - /api/* 和 /health 反向代理到本机 Go 服务 :8080
#   - 做 TLS、HTTP/2、压缩、X-Forwarded-For 透传
#
# 安装到 /etc/nginx/conf.d/lopezpress.conf 后：nginx -t && systemctl reload nginx
# 前提：前端构建产物已上传到 /opt/lopezpress/web/

server {
    listen 80;
    server_name yourdomain.example;
    # 强制跳 HTTPS（生产建议启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---------- 前端静态资源 ----------
    # Preact 构建产物（SPA），所有非 /api 路径都回退到 index.html
    root /opt/lopezpress/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到 Go 服务 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 真实 IP 透传（限流器用它做每 IP 桶）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # 超时
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css image/svg+xml;

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/lopezpress.access.log;
    error_log  /var/log/nginx/lopezpress.error.log;
}
