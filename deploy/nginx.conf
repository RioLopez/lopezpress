# Nginx 配置（生产）
# 作用：
#   - 前端静态资源（Preact 构建产物）由 Nginx 直接服务
#   - /api/* 和 /health 反向代理到本机 Go 服务 :8080
#   - 做 TLS、HTTP/2、压缩、X-Forwarded-For 透传
#
# 安装到 /etc/nginx/conf.d/lopezpress.conf 后：nginx -t && systemctl reload nginx
# 前提：前端构建产物已上传到 /opt/lopezpress/web/

server {
    listen 80;
    server_name yourdomain.example;
    # 强制跳 HTTPS（生产建议启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 不回显 nginx 版本号：默认 on 会在错误页和 Server 头里带上版本，
    # 等于免费告诉扫描器该打哪个 CVE。
    server_tokens off;

    # 请求体上限。**这一行缺失会让图片上传在生产环境直接失败**：
    # nginx 默认 client_max_body_size 是 1 MB，而本应用的图片上限是
    # upload_max_image（默认 5 MB），请求根本到不了 Go 进程，浏览器收到的是
    # nginx 自己的 413 页面（不是应用 JSON）。开发时没有 nginx，所以这个问题
    # 只在上线后出现。
    #
    # 取值 = 应用中最大可配置的单图上限（site_config.upload_max_image，允许调到
    # 与 UPLOAD_MAX_BYTES 同量级）+ multipart 边框与头部开销。如果你想收紧，
    # 可以，但必须 >= 你在后台设置的 upload_max_image，否则会出现
    # "后台设了 5 MB、上传 4 MB 仍然 413"的诡异现象。
    client_max_body_size 32m;
    # 慢速上传不需要拖那么久；与 client_max_body_size 配合防止慢速攻击占用连接。
    client_body_timeout 60s;

    # HSTS：仅 HTTPS 块设置（:80 块已在上面 301 跳到 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 前端静态资源 ----------
    # Preact 构建产物（SPA），所有非 /api 路径都回退到 index.html
    root /opt/lopezpress/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 上传图片反代到 Go ----------
    # 上传文件落在 Go 进程的 UPLOAD_DIR，不在 web 根目录下。没有这个 location
    # 时 /uploads/*.png 会掉进 location / 的 try_files 并返回 index.html，
    # 导致生产环境所有上传图片都变成空白。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ---------- RSS / sitemap / robots 反代到 Go ----------
    # 同样不在 web 根目录，缺了会被 SPA 回退吞掉。
    location = /feed       { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }

    # ---------- API 反向代理到 Go 服务 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 真实 IP 透传（限流器用它做每 IP 桶）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # 超时
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP：允许自身资源 + 内联（index.html 里的主题引导脚本、组件 style 属性）
    # + SM.MS 远程图片；connect-src 锁到自身，压缩 XSS 的窃取面。
    # 想进一步收紧：把 index.html 的内联主题脚本拆成外部文件，然后去掉
    # script-src 的 'unsafe-inline' 并改用 'self'。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css image/svg+xml;

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx 的 add_header 不继承：本 block 一旦声明了 add_header，就丢掉
        # server 级的安全头，所以这里必须重复声明。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/lopezpress.access.log;
    error_log  /var/log/nginx/lopezpress.error.log;
}
