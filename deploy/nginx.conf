# Nginx 配置（生产）
# 作用：
#   - 前端静态资源（Preact 构建产物）由 Nginx 直接服务
#   - /api/* 和 /health 反向代理到本机 Go 服务 :8081
#   - 做 TLS、HTTP/2、压缩、X-Forwarded-For 透传
#
# 安装到 /etc/nginx/conf.d/lopezpress.conf 后：nginx -t && systemctl reload nginx
# 前提：前端构建产物已上传到 /opt/lopezpress/web/

server {
    listen 80;
    server_name yourdomain.example;
    # 强制跳 HTTPS（生产建议启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 不回显 nginx 版本号：默认 on 会在错误页和 Server 头里带上版本，
    # 等于免费告诉扫描器该打哪个 CVE。
    server_tokens off;

    # 请求体上限。**这一行缺失会让图片上传在生产环境直接失败**：
    # nginx 默认 client_max_body_size 是 1 MB，而本应用的图片上限是
    # upload_max_image（默认 5 MB），请求根本到不了 Go 进程，浏览器收到的是
    # nginx 自己的 413 页面（不是应用 JSON）。开发时没有 nginx，所以这个问题
    # 只在上线后出现。
    #
    # 取值 = 应用中最大可配置的单图上限（site_config.upload_max_image，允许调到
    # 与 UPLOAD_MAX_BYTES 同量级）+ multipart 边框与头部开销。如果你想收紧，
    # 可以，但必须 >= 你在后台设置的 upload_max_image，否则会出现
    # "后台设了 5 MB、上传 4 MB 仍然 413"的诡异现象。
    client_max_body_size 32m;
    # 慢速上传不需要拖那么久；与 client_max_body_size 配合防止慢速攻击占用连接。
    client_body_timeout 60s;

    # HSTS：仅 HTTPS 块设置（:80 块已在上面 301 跳到 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 拒绝探测点文件 ----------
    # SPA 的 try_files 回退会把**任何**未命中路径变成 index.html 并回 200，
    # 于是 /.env、/.git/config、/.git/HEAD、/deploy/、/internal/ 通通返回
    # 200 + 1049 字节的首页。内容没漏，但这不是"没事"：
    #   - 扫描器看到 200 会把它标成"发现敏感文件"，你会收到一堆误报；
    #     哪天 web root 被误配成上一级目录，同样的规则就真的把 .git 送出去了。
    #   - 一堆本该 404 的路径回 200，等于替对方确认"这是个 SPA、源码目录叫
    #     internal、部署脚本叫 deploy"。
    # 一条正则一次性关死。注意必须放在 SPA 回退之前，且 .well-known 要显式放行
    # （`^~` 前缀匹配后不再走正则，所以它排在下面不会被吃）。
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- 前端静态资源 ----------
    # Preact 构建产物（SPA），所有非 /api 路径都回退到 index.html
    root /opt/lopezpress/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # 安全头写在这里而不是 server 级：nginx 的 add_header 是"要么全继承、
        # 要么全不继承"，server 级一旦声明，下面每个 proxy 块都会继承一份，
        # 与 Go 自己发的同名头叠加。线上实测 /api/auth/me 的响应里
        # X-Frame-Options、Referrer-Policy 各出现两次，CSP 更是出现了两条
        # **互相冲突**的策略（Go: default-src 'none'，nginx: default-src 'self'）。
        # 多条 CSP 浏览器全部执行、取交集，行为不可预测且极难调试。
        # 分工：nginx 只管它自己发的 HTML/静态文件，动态响应由 Go 负责。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # ---------- 上传图片反代到 Go ----------
    # 上传文件落在 Go 进程的 UPLOAD_DIR，不在 web 根目录下。没有这个 location
    # 时 /uploads/*.png 会掉进 location / 的 try_files 并返回 index.html，
    # 导致生产环境所有上传图片都变成空白。
    #
    # 前缀必须带 ^~：下面的 location ~* \.(js|css|png|jpg...)$ 是正则 location，
    # 而 nginx 里正则优先于普通前缀匹配。普通 `location /uploads/` 会被那条
    # 正则吃掉，于是 /uploads/xxx.jpg 不走代理、直接在 web 根目录找不到文件，
    # 线上所有上传图片都变成 404——本地没有 nginx，所以只在上线后出现。
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # 不要在这里加 add_header Cache-Control：proxy 会原样透传 Go 的
        # ServeUploads 发的 `public, max-age=31536000, immutable`。上传文件名
        # 是插入时随机生成的 22 个字符、永不复用（同内容走 sha256 命中同一
        # 行，内容一变就是新名字），所以一个 URL 指向的字节永远不会变。
        # 在这里再加一条就是两个 Cache-Control 头，行为取决于浏览器怎么合并。
    }

    # ---------- RSS / sitemap / robots 反代到 Go ----------
    # 同样不在 web 根目录，缺了会被 SPA 回退吞掉。
    # X-Forwarded-For 必须带：Go 的取图配额与体检按客户端 IP 计数，缺了这行
    # 全部请求会被记成 127.0.0.1。
    location = /feed        { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ---------- API 反向代理到 Go 服务 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # 真实 IP 透传（限流器用它做每 IP 桶）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # 超时
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # ---------- 安全响应头 ----------
    # 只留 HSTS 在 server 级：它与其他头不同，重复同值无害，而且 :80 → :443 的
    # 跳转响应也应该带上。其余头都下沉到各自 location（见上方说明）。
    #
    # 这里**不要**再写 X-Content-Type-Options / X-Frame-Options / Referrer-Policy
    # / CSP：它们会与 Go 的 SecurityHeaders 叠加，产生重复与冲突的 CSP。
    # 下面 /api/ 等 proxy 块的响应头由 Go 负责，nginx 不再插手。

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css image/svg+xml;

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx 的 add_header 不继承：本 block 一旦声明了 add_header，就丢掉
        # server 级的安全头，所以这里必须重复声明。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/lopezpress.access.log;
    error_log  /var/log/nginx/lopezpress.error.log;
}
