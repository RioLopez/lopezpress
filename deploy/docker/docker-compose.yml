# lopezpress — container deployment (Docker Compose)
#
# Two services mirroring the proven systemd layout:
#   api — Go static binary on distroless; SQLite + local uploads under /data
#   web — Nginx serving the Preact dist, reverse-proxying to the api service
#
# Quick start (from this directory):
#   1. Edit api.env: set JWT_SECRET (openssl rand -hex 32).
#   2. docker compose up -d --build
#   3. curl http://<host>/health   -> {"status":"ok"}
#
# Persistent data lives in the named volume "api-data".

services:
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: lopezpress/api:latest
    restart: unless-stopped
    env_file:
      - api.env
    environment:
      # Force container paths regardless of api.env values.
      DB_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - api-data:/data
    expose:
      - "8080"
    # Reach the API directly for debugging (host-only):
    # ports:
    #   - "127.0.0.1:8080:8080"

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    image: lopezpress/web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    # TLS: terminate at an upstream proxy, or mount certs + switch the vhost
    # to 443 (see README.md in this directory).

volumes:
  api-data:
