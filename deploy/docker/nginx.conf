# lopezpress — web container vhost (Docker Compose model)
#
# Serves the Preact SPA and reverse-proxies /api, /health and /uploads to the
# "api" service (Go). TLS is expected to be terminated by an upstream proxy
# (Caddy / Traefik / host Nginx); this vhost is plain HTTP on the compose net.
# Adapted from the proven deploy/nginx.conf, with the /uploads/ proxy added
# (local image hosting is served by the Go backend, not by static files).

upstream echo_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # ---------- 前端静态资源（SPA） ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到 Go 服务 ----------
    location /api/ {
        proxy_pass http://echo_api;
        proxy_http_version 1.1;

        # 真实 IP 透传（限流器据此做每 IP 桶）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 健康检查
    location /health {
        proxy_pass http://echo_api;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # 本地上传的图片由 Go 的 ServeUploads 提供（systemd 版 nginx 漏了这条）
    location /uploads/ {
        proxy_pass http://echo_api;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css image/svg+xml;

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
